name: Release

# Runs once per release, when it is published (a prerelease promoted later does not publish again).
on:
  release:
    types: [published]

jobs:
  release:
    name: Publish plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches the plugin version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match pluginVersion $version" >&2
            exit 1
          fi

      - name: Test and verify
        run: ./gradlew test verifyPlugin

      - name: Sign and publish plugin
        run: ./gradlew publishPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Upload signed zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*-signed.zip --clobber
