mt4ij.whats-new.about=Maven Templating assistant supporta il templating-maven-plugin in IntelliJ IDEA: mantiene le cartelle dei template contrassegnate come sorgenti, anche dopo un reimport di Maven, e permette di passare facilmente tra i template, i sorgenti generati e le proprietà Maven che usano.
