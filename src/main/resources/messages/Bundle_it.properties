mt4ij.whats-new.where.2=Le icone nel margine dell''editor e il banner in cima ai template e ai sorgenti generati portano all''altro file; la scorciatoia è {0} (Vai al sorgente generato / Vai al template).
mt4ij.whats-new.where.3=Il menu Tools > Maven Templating ha le stesse voci, tra cui la ricerca delle cartelle dei template, la guida e questa pagina.
mt4ij.whats-new.where.4=Le impostazioni sono in Settings > Build, Execution, Deployment > Build Tools > Maven Templating assistant.
